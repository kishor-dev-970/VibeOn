# Render Blueprint for the Social Music backend
# NOTE: this file contains real secret values. Keep the repo private.
#
# Persistent disk note: Render's Free plan does NOT support disks. The default VIDEO_CACHE_DIR
# (/var/cache/social-music) still works on a Free instance (cached videos live on the container's
# writable layer and are lost when the service restarts). Upgrade to at least Starter, then
# uncomment the `disk:` block to keep the cache across restarts.

services:
  - type: web
    name: social-music-server
    runtime: docker
    repo: https://github.com/kishor-dev-970/My_SocialMusic_Project.git
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    # disk:
    #   name: media-cache
    #   mountPath: /var/cache/social-music
    #   sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_PATH
        value: python3
      - key: FFMPEG_PATH
        value: /usr/bin
      - key: VIDEO_CACHE_DIR
        value: /var/cache/social-music
      - key: SUPABASE_URL
        value: https://treahljceqcabceskyjq.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
