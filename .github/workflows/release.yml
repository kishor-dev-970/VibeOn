name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SimpleTune
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/vibeon.jks
          cat > keystore/key.properties <<'EOF'
          storeFile=vibeon.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=vibeon
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF
          
      - name: Build VibeOn APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APK
        working-directory: SimpleTune
        run: mv app/build/outputs/apk/debug/app-debug.apk "../VibeOn_${{ steps.version.outputs.tag }}.apk"

      - name: Clean stale release assets
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          rel_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          rel_url=$(curl -sS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "${rel_api}" | jq -r '.url // empty')
          if [ -n "${rel_url}" ]; then
            for id in $(curl -sS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "${rel_url}/assets" | jq -r --arg keep "VibeOn_${tag}.apk" '.[] | select(.name != $keep) | .id'); do
              curl -sS -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "${rel_url}/assets/${id}"
            done
          fi

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: "Release ${{ steps.version.outputs.tag }}"
          files: VibeOn_${{ steps.version.outputs.tag }}.apk