name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Dump RN CLI config
        run: |
          node --version
          pwd
          npx --no-install @react-native-community/cli config > /tmp/rn-config.json 2>&1
          wc -c /tmp/rn-config.json
          echo "--- head ---"
          head -c 300 /tmp/rn-config.json
          echo
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("/tmp/rn-config.json","utf8")); const p=c.project||{}; console.log("project keys="+Object.keys(p)); console.log("android="+JSON.stringify(p.android));'

      - name: Run gradle settings phase
        run: cd android && ./gradlew help -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
        env:
          NODE_ENV: production

      - name: Dump generated autolinking.json
        run: |
          echo "--- autolinking.json project section ---"
          node -e 'const fs=require("fs"); try{const c=JSON.parse(fs.readFileSync("android/build/generated/autolinking/autolinking.json","utf8")); console.log("pkg="+((c.project&&c.project.android&&c.project.android.packageName)||"MISSING")); console.log("project="+JSON.stringify(c.project));}catch(e){console.log("no autolinking.json: "+e.message);}'

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
        env:
          NODE_ENV: production

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeOn-v1.5.4-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk